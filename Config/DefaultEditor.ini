; MCP usage analytics are off (AGENTS.md section 5, docs/decisions.md 2026-11-21).
; The console variable is defined in Engine/Plugins/Experimental/ModelContextProtocol/
;   Source/ModelContextProtocol/Private/ModelContextProtocolAnalytics.cpp (default true, ECVF_Default).
; [ConsoleVariables] of the Editor ini is applied in editor builds only
;   (Engine/Source/Runtime/Core/Private/Misc/ConfigCacheIni.cpp, FConfigCacheIni::LoadConsoleVariablesFromINI).
; A value set before the plugin module registers the variable is kept and copied over at registration
;   (Engine/Source/Runtime/Core/Private/Misc/ConfigUtilities.cpp, Engine/Source/Runtime/Core/Private/HAL/ConsoleManager.cpp).
; Files ending in "editor.ini" are not staged into packages
;   (Engine/Source/Programs/AutomationTool/AutomationUtils/DeploymentContext.cs, IniSuffixDenyList).

[ConsoleVariables]
ModelContextProtocol.EnableAnalytics=0
